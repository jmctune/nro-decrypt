name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: publish cli
        run: >
          dotnet publish cli/nrodecrypt.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: publish gui
        run: >
          dotnet publish gui/nrodecrypt-gui.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: collect exes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/nrodecrypt.exe, out/nrodecrypt-gui.exe release/
          Get-FileHash release/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content release/SHA256SUMS.txt

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/nrodecrypt.exe
            release/nrodecrypt-gui.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
